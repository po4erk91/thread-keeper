name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    name: pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest
    env:
      # This remains stable while tests intentionally isolate HOME per case.
      THREADKEEPER_EMBED_CACHE_DIR: ${{ github.workspace }}/.cache/huggingface/hub
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (config.py uses tomllib + dict[str,...]).
        # 3.13 is current. 3.12 sits in between.
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # Editable install with both optional-dep groups. semantic is
          # required: a handful of tests (test_delegated_search,
          # test_vec_search) assert on actual cosine search behavior and
          # don't have a skip-when-missing guard. semantic now uses
          # fastembed/ONNX Runtime (no PyTorch) + numpy + sqlite-vec; the
          # model snapshot is pinned and pre-fetched below.
          pip install -e '.[semantic,dev]'

      - name: Cache pinned embedding snapshot
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: huggingface-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('threadkeeper/config.py') }}

      - name: Pre-fetch pinned embedding snapshot
        run: |
          python -c 'from threadkeeper.embeddings import prefetch_embedding_model; print(prefetch_embedding_model())'

      - name: Run pytest
        env:
          # Background daemons are forced off; tests need a quiet
          # process. Embeddings stay ON so semantic tests pass.
          THREADKEEPER_INGEST_INTERVAL_S: "0"
          THREADKEEPER_SHADOW_REVIEW_INTERVAL_S: "0"
          THREADKEEPER_SPAWN_BUDGET_POLL_S: "0"
          THREADKEEPER_SEARCH_PROXY_POLL_S: "0"
          # Semantic tests prove the cached pin is usable without a Hub request.
          THREADKEEPER_EMBED_LOCAL_FILES_ONLY: "1"
          HF_HUB_OFFLINE: "1"
        run: |
          # --forked isolates each test in its own process. The suite's
          # per-test package re-import (tests/conftest.py) otherwise piles up
          # native ONNX/tokenizer thread pools that can deadlock sqlite
          # connection finalize in a single long-lived interpreter.
          # NB: kept serial on purpose. `-n auto` (pytest-xdist) does not
          # compose here — with --forked it collides on the xdist worker tmp
          # dir, and without --forked a few tests race on shared state. Fixing
          # the suite for parallel runs is tracked separately; xdist is shipped
          # as an opt-in local accelerator (see CONTRIBUTING).
          python -m pytest -q --forked --tb=short

  pip-audit:
    name: pip-audit (resolved dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Resolve project dependencies
        run: |
          python -m pip install --upgrade pip
          # Audit the same runtime, semantic, and test dependency set that CI
          # resolves, rather than only direct requirements from pyproject.toml.
          python -m pip install -e '.[semantic,dev]'
          # Keep the resolved dependencies but remove the editable project:
          # its bumped version intentionally does not exist on PyPI before the
          # release, and --strict treats even an explicit editable skip as an
          # incomplete audit.
          python -m pip uninstall -y threadkeeper
          python -m pip install pip-audit

      - name: Fail on known dependency vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          ignore_args=()
          while IFS='|' read -r vulnerability_id tracking rationale review_by; do
            if [[ "$vulnerability_id" =~ ^[[:space:]]*(#|$) ]]; then
              continue
            fi
            if [[ -z "$tracking" || -z "$rationale" || -z "$review_by" ]]; then
              echo "::error::Malformed .github/pip-audit-ignores.txt entry for $vulnerability_id"
              exit 1
            fi
            vulnerability_id="${vulnerability_id//[[:space:]]/}"
            ignore_args+=(--ignore-vuln "$vulnerability_id")
          done < .github/pip-audit-ignores.txt
          # With no input arguments, pip-audit audits this fully resolved
          # dependency environment. --strict makes incomplete dependency
          # collection fail.
          pip-audit --local --strict "${ignore_args[@]}"
