name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest-shard:
    name: pytest shard ${{ matrix.shard }}/3 (py${{ matrix.python }}, mcp${{ matrix.mcp }})
    runs-on: ubuntu-latest
    env:
      # This remains stable while tests intentionally isolate HOME per case.
      THREADKEEPER_EMBED_CACHE_DIR: ${{ github.workspace }}/.cache/huggingface/hub
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor (config.py uses tomllib + dict[str,...]).
        # 3.13 is current. 3.12 sits in between.
        python: ["3.11", "3.12", "3.13"]
        # Durable Tasks requires MCP 2.3's 2026-07-28 extension surface.
        mcp: [">=2.3.0,<3"]
        # The suite is split into three deterministic shards (by test id)
        # that run as parallel jobs; see tests/conftest.py.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"

      - name: Install package + test deps
        run: |
          python -m pip install --upgrade pip
          # Editable install with both optional-dep groups. semantic is
          # required: a handful of tests (test_delegated_search,
          # test_vec_search) assert on actual cosine search behavior and
          # don't have a skip-when-missing guard. semantic now uses
          # fastembed/ONNX Runtime (no PyTorch) + numpy + sqlite-vec; the
          # model snapshot is pinned and pre-fetched below.
          pip install -e '.[semantic,dev]' "mcp${{ matrix.mcp }}"

      - name: Cache pinned embedding snapshot
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.cache/huggingface
          key: huggingface-${{ runner.os }}-py${{ matrix.python }}-${{ hashFiles('threadkeeper/config.py') }}

      - name: Pre-fetch pinned embedding snapshot
        run: |
          python -c 'from threadkeeper.embeddings import prefetch_embedding_model; print(prefetch_embedding_model())'

      - name: Run pytest
        env:
          # Background daemons are forced off; tests need a quiet
          # process. Embeddings stay ON so semantic tests pass.
          THREADKEEPER_INGEST_INTERVAL_S: "0"
          THREADKEEPER_SHADOW_REVIEW_INTERVAL_S: "0"
          THREADKEEPER_SPAWN_BUDGET_POLL_S: "0"
          THREADKEEPER_SEARCH_PROXY_POLL_S: "0"
          # Semantic tests prove the cached pin is usable without a Hub request.
          THREADKEEPER_EMBED_LOCAL_FILES_ONLY: "1"
          HF_HUB_OFFLINE: "1"
          THREADKEEPER_TEST_SHARD: ${{ matrix.shard }}/3
        run: |
          # --forked isolates each test in its own process. The suite's
          # per-test package re-import (tests/conftest.py) otherwise piles up
          # native ONNX/tokenizer thread pools that can deadlock sqlite
          # connection finalize in a single long-lived interpreter. That is
          # also why parallelism comes from shard jobs, not xdist workers: an
          # xdist worker is one long-lived interpreter, and an unforked -n auto
          # run took over two hours on CI.
          python -m pytest -q --forked --tb=short

  # Branch protection requires one `pytest (py3.x)` check per Python. Each of
  # these succeeds only when every shard job above succeeded.
  pytest:
    name: pytest (py${{ matrix.python }})
    needs: pytest-shard
    if: always()
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - name: Require every shard to pass
        env:
          SHARDS: ${{ needs.pytest-shard.result }}
        run: |
          echo "pytest shards: $SHARDS"
          test "$SHARDS" = "success"

  conformance:
    name: MCP conformance requirements
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install test server
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Build pinned official conformance runner
        run: |
          CONFORMANCE_REF=c37eec888e1c6ff140af79987a40008548b7cc5f
          git clone --no-checkout https://github.com/modelcontextprotocol/conformance.git .conformance
          git -C .conformance fetch --depth=1 origin "$CONFORMANCE_REF"
          git -C .conformance checkout --detach "$CONFORMANCE_REF"
          npm --prefix .conformance ci
          npm --prefix .conformance run build

      - name: Run official MCP requirement sets
        env:
          THREADKEEPER_DISABLE_BG_DAEMONS: "1"
          THREADKEEPER_NO_EMBEDDINGS: "1"
          THREADKEEPER_MENUBAR_AUTO_LAUNCH: "0"
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/conformance-home"
          export CLAUDE_PROJECTS_DIR="$RUNNER_TEMP/conformance-projects"
          export THREADKEEPER_DB="$RUNNER_TEMP/conformance.sqlite"
          mkdir -p "$HOME" "$CLAUDE_PROJECTS_DIR"

          python -m threadkeeper.conformance_server > "$RUNNER_TEMP/conformance-server.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          server_ready=false
          for _ in {1..60}; do
            if python -c 'import socket; socket.create_connection(("127.0.0.1", 8765), 0.2).close()' > /dev/null 2>&1; then
              server_ready=true
              break
            fi
            sleep 0.25
          done
          test "$server_ready" = true

          node .conformance/dist/index.js server \
            --url http://127.0.0.1:8765/mcp \
            --requirements 2025-11-25 \
            --expected-failures tests/conformance/expected-failures.2025-11-25.yml
          node .conformance/dist/index.js server \
            --url http://127.0.0.1:8765/mcp \
            --requirements 2026-07-28 \
            --expected-failures tests/conformance/expected-failures.2026-07-28.yml

  encrypted-storage:
    name: SQLCipher storage (py3.12)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install encrypted storage extra
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[encrypted,dev]'

      - name: Exercise SQLCipher sidecars and recovery
        env:
          THREADKEEPER_DISABLE_BG_DAEMONS: "1"
        run: python -m pytest -q tests/test_storage.py --tb=short

  pip-audit:
    name: pip-audit (resolved dependencies)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Resolve project dependencies
        run: |
          python -m pip install --upgrade pip
          # Audit the same runtime, semantic, and test dependency set that CI
          # resolves, rather than only direct requirements from pyproject.toml.
          python -m pip install -e '.[semantic,dev]'
          # Keep the resolved dependencies but remove the editable project:
          # its bumped version intentionally does not exist on PyPI before the
          # release, and --strict treats even an explicit editable skip as an
          # incomplete audit.
          python -m pip uninstall -y threadkeeper
          python -m pip install pip-audit

      - name: Fail on known dependency vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          ignore_args=()
          while IFS='|' read -r vulnerability_id tracking rationale review_by; do
            if [[ "$vulnerability_id" =~ ^[[:space:]]*(#|$) ]]; then
              continue
            fi
            if [[ -z "$tracking" || -z "$rationale" || -z "$review_by" ]]; then
              echo "::error::Malformed .github/pip-audit-ignores.txt entry for $vulnerability_id"
              exit 1
            fi
            vulnerability_id="${vulnerability_id//[[:space:]]/}"
            ignore_args+=(--ignore-vuln "$vulnerability_id")
          done < .github/pip-audit-ignores.txt
          # With no input arguments, pip-audit audits this fully resolved
          # dependency environment. --strict makes incomplete dependency
          # collection fail.
          pip-audit --local --strict "${ignore_args[@]}"
